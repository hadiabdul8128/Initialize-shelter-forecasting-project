[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shelter-forecasting"
version = "0.2.0"
description = "Leakage-safe neural-network forecasts for daily homeless shelter census counts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hadi Abdul" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.26,<1",
  "torch>=2.6,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
train = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "mlflow>=3,<4",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
]
dev = [
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "mlflow>=3,<4",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
]

[project.scripts]
shelter-forecast = "shelter_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*utcnow.*is deprecated.*:DeprecationWarning:mlflow.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
